inherit_from:
  - .rubocop_todo.yml

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/*'
    - 'db/seeds.rb'
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'vendor/bundle/**/*'
    - 'client/**/*'
  TargetRubyVersion: 3.3

Bundler/OrderedGems:
  Enabled: false

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/EmptyLineAfterMagicComment:
  Enabled: false

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/LineLength:
  Max: 120

Lint/AmbiguousBlockAssociation:
  # Jbuilder templates are a DSL where `json.foo bar do ... end` is idiomatic.
  Exclude:
    - '**/*.jbuilder'

Lint/ConstantDefinitionInBlock:
  Enabled: false

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'

# The Metrics limits below are deliberately more permissive than RuboCop's defaults.
# They were calibrated against the existing code base so that the cops flag genuine outliers.
Metrics/AbcSize:
  Max: 35
  # Rails code reads the same attribute repeatedly (`current_course`, `submission.assessment`);
  # counting each read separately inflates the score without indicating real complexity.
  CountRepeatedAttributes: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc']
  CountComments: false

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 30
  CountAsOne: ['array', 'hash', 'heredoc']
  CountComments: false

Metrics/ModuleLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc']
  CountComments: false

Metrics/PerceivedComplexity:
  Max: 15

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/AsciiComments:
  AllowedChars: ['©', '├', '─', '└']

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

Style/CollectionMethods:
  Enabled: true
  PreferredMethods:
    reduce:
    inject: 'reduce'
    find:
    detect: 'find'

Style/Documentation:
  Enabled: false

Style/EmptyMethod:
  Enabled: false

Style/HashAsLastArrayItem:
  EnforcedStyle: no_braces

Style/LambdaCall:
  Exclude:
    - '**/*.json.jbuilder'

Style/NumericPredicate:
  EnforcedStyle: comparison

Style/OneClassPerFile:
  Enabled: false

Style/ParallelAssignment:
  Enabled: false

Style/RegexpLiteral:
  AllowInnerSlashes: true

Style/SignalException:
  EnforcedStyle: only_raise

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/SymbolArray:
  Enabled: false

Style/TernaryParentheses:
  EnforcedStyle: require_parentheses_when_complex

Style/WordArray:
  Enabled: false
