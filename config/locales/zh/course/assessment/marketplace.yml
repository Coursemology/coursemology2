zh:
  course:
    assessment:
      marketplace:
        preview_container:
          description_html: |
            <p>欢迎来到<strong>市场预览沙盒</strong>——一个用于试用的临时课程，你可以在把评估市场上共享的评估采用到自己的课程之前，先在这里试用一下。</p>
            <p>你会来到这里，是因为你启动了动手预览。评估会在单独的标签页中打开，你可以像你的学生和评分者那样作答、提交和评分。</p>
            <ul>
              <li><strong>这里的一切都不是真实的。</strong>作答、成绩和积分都只留在此沙盒中，绝不会进入任何课程——无论是你的还是作者的。</li>
              <li><strong>内容为只读。</strong>这里的每个评估都是其市场条目的冻结副本，无法从沙盒中编辑。</li>
              <li><strong>作答会在闲置一段时间后自动清除。</strong>若想重新试做已提交的评估，请在提交页面上方的横幅中点击<strong>重置提交</strong>按钮。</li>
              <li><strong>侧边栏导航已停用。</strong>此沙盒的唯一用途，就是试用你所打开的那个评估。</li>
            </ul>
            <p>当你准备正式使用某个评估时，请回到自己的课程，从市场中复制它。</p>
