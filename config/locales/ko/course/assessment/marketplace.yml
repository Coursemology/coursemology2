ko:
  course:
    assessment:
      marketplace:
        preview_container:
          description_html: |
            <p><strong>마켓플레이스 미리보기 샌드박스</strong>에 오신 것을 환영합니다. 평가 마켓플레이스에 공개된 평가를 내 코스에 도입하기 전에 직접 사용해 볼 수 있는 임시 코스입니다.</p>
            <p>직접 해보기 미리보기를 실행하셨기 때문에 이 페이지에 오셨습니다. 평가는 별도의 탭에서 열리며, 학생과 채점자가 하는 것과 똑같이 답안을 작성하고 제출하고 채점할 수 있습니다.</p>
            <ul>
              <li><strong>이곳의 어떤 것도 실제가 아닙니다.</strong> 답안, 성적, 점수는 모두 이 샌드박스 안에만 남으며, 내 코스든 작성자의 코스든 어떤 코스에도 반영되지 않습니다.</li>
              <li><strong>콘텐츠는 읽기 전용입니다.</strong> 이곳의 각 평가는 마켓플레이스 항목의 고정된 복사본이므로 샌드박스에서 수정할 수 없습니다.</li>
              <li><strong>답안은 한동안 사용하지 않으면 자동으로 삭제됩니다.</strong> 이미 제출한 평가를 처음부터 다시 풀려면 제출 화면 상단 배너에 있는 <strong>제출 재설정</strong> 버튼을 사용하세요.</li>
              <li><strong>사이드바 내비게이션은 비활성화되어 있습니다.</strong> 이 샌드박스는 열어 본 평가를 사용해 보는 용도로만 존재합니다.</li>
            </ul>
            <p>평가를 실제로 사용할 준비가 되면 내 코스로 돌아가 마켓플레이스에서 복제하세요.</p>
