# Run the ConsolidatedItemEmailJob for opening reminders on the 5th minute of each hour.
consolidated_item_email_job:
  cron: '5 * * * *'
  class: 'ConsolidatedItemEmailJob'
  queue: 'default'

# Run the VideoStatisticUpdateJob every day at 21:30 UTC, 5:30 AM SGT
video_statistic_update_job:
  cron: '30 21 * * *'
  class: 'VideoStatisticUpdateJob'
  queue: 'default'

# Run the UserEmailDatabaseCleanupJob every month
user_email_database_cleanup_job:
  cron: '0 0 1 * *'
  class: 'UserEmailDatabaseCleanupJob'
  queue: 'default'

# Schedule force-submit jobs for attempting submissions whose force-submit time is imminent but were
# not scheduled at creation (long-lived attempts, or past-due submissions whose job was lost).
# Runs on the 10th minute of each hour to deconflict with the ConsolidatedItemEmailJob.
schedule_expiring_submissions_job:
  cron: '10 * * * *'
  class: 'Course::Assessment::Submission::ScheduleExpiringSubmissionsJob'
  queue: 'default'
